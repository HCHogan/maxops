[workspace]
members = ["crates/maxops-proto", "crates/maxops-store", "crates/maxops-executor", "crates/maxops-agent", "crates/maxops-hub", "crates/maxopsctl"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
color-eyre = "0.6"
jiff = { version = "0.2", features = ["serde"] }
criterion = "0.8"
utoipa = { version = "5", features = ["axum_extras", "jiff_0_2"] }
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "string"] }
futures = "0.3"
http-body-util = "0.1"
maxops-proto = { path = "crates/maxops-proto" }
maxops-store = { path = "crates/maxops-store" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rustix = { version = "=1.1.4", features = ["fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "fs", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
blake3 = "1"
uuid = { version = "1", features = ["serde", "v7"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
